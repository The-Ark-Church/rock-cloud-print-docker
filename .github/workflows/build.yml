# Validation build. Runs on every push to main and every pull request, and
# proves the image still builds for both architectures - without publishing
# anything. This is what catches a broken Dockerfile before it reaches a tag.
name: build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (no publish)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          # Nothing is published here; this exercises the same build argument the
          # release workflow uses so a broken version plumbing fails on the PR.
          build-args: |
            VERSION=dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
