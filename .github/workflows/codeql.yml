# Static security analysis with GitHub CodeQL. Results appear under the
# repository's Security tab (Code scanning), and on a pull request any new
# alert is shown inline on the changed lines.
#
# Code scanning must be enabled on the repository for the upload step to
# succeed. It is free for public repositories.
#
# Actions are pinned to commit SHAs for the same reason as in release.yml: a
# compromised or retagged action cannot silently change what runs here. The
# init and analyze steps must use the same codeql-action commit.
name: codeql

on:
  push:
    branches: [ main ]
  pull_request:
  # CodeQL's queries are updated independently of this repository, so a
  # weekly run re-checks unchanged code against whatever has been added since.
  schedule:
    - cron: '27 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    # security-events: write is what lets the job upload results. The
    # actions: read permission that CodeQL's templates add is only needed on
    # private repositories, so it is left out.
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # build-mode none extracts C# straight from source without
          # compiling it. That is the right trade here for two reasons.
          #
          # It does not depend on the .NET SDK, so the workflow keeps working
          # unchanged as the projects move between target frameworks, rather
          # than breaking on the day a retarget merges without a matching
          # setup-dotnet change.
          #
          # The cost is slightly less precise type information, and so a
          # little less precise dataflow, than a real build would give. For a
          # small codebase of minimal APIs that is a fair price for a
          # workflow that cannot be broken by a toolchain change.
          - language: csharp
            build-mode: none
          # The JavaScript extractor also analyses inline <script> blocks in
          # HTML, so the web UI is covered whether its script lives in
          # index.html or in a separate app.js.
          - language: javascript-typescript
            build-mode: none
          # python is deliberately absent. The only Python in the repository
          # is the fake printer and fake Rock server in tools/, which are
          # local test harnesses that never ship in the image.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
